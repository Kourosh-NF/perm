<svg width="800" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="perm answers three questions: what permissions a file has, what changed since last time, and why a user cannot access a file"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#111B2E"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/></linearGradient></defs>
<rect x="2.5" y="2.5" width="247" height="145" rx="18" fill="url(#bg)" stroke="url(#edge)"/><rect x="2.5" y="2.5" width="247" height="145" rx="18" fill="url(#glass)"/><rect x="22" y="22" width="36" height="36" rx="11" fill="#58A6FF" fill-opacity="0.14" stroke="#58A6FF" stroke-opacity="0.55"/><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" x="40" y="46" text-anchor="middle" fill="#58A6FF" font-size="17" font-weight="700">1</text><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="70" y="46" fill="#FFFFFF" font-size="20" font-weight="700">Permissions</text><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="24" y="82" fill="#A8B3C1" font-size="16.5">What permissions does</text><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="24" y="103" fill="#A8B3C1" font-size="16.5">this file have?</text><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" x="24" y="128" font-size="14"><tspan fill="#3FB950">$</tspan><tspan fill="#58A6FF"> perm /etc/passwd</tspan></text><rect x="274.5" y="2.5" width="247" height="145" rx="18" fill="url(#bg)" stroke="url(#edge)"/><rect x="274.5" y="2.5" width="247" height="145" rx="18" fill="url(#glass)"/><rect x="294" y="22" width="36" height="36" rx="11" fill="#8957E5" fill-opacity="0.14" stroke="#8957E5" stroke-opacity="0.55"/><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" x="312" y="46" text-anchor="middle" fill="#8957E5" font-size="17" font-weight="700">2</text><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="342" y="46" fill="#FFFFFF" font-size="20" font-weight="700">Drift</text><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="296" y="82" fill="#A8B3C1" font-size="16.5">What changed since</text><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="296" y="103" fill="#A8B3C1" font-size="16.5">last time?</text><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" x="296" y="128" font-size="14"><tspan fill="#3FB950">$</tspan><tspan fill="#8957E5"> perm --check FILE</tspan></text><rect x="546.5" y="2.5" width="247" height="145" rx="18" fill="url(#bg)" stroke="url(#edge)"/><rect x="546.5" y="2.5" width="247" height="145" rx="18" fill="url(#glass)"/><rect x="566" y="22" width="36" height="36" rx="11" fill="#39D0D8" fill-opacity="0.14" stroke="#39D0D8" stroke-opacity="0.55"/><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" x="584" y="46" text-anchor="middle" fill="#39D0D8" font-size="17" font-weight="700">3</text><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="614" y="46" fill="#FFFFFF" font-size="20" font-weight="700">Access</text><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="568" y="82" fill="#A8B3C1" font-size="16.5">Why can&#x27;t user X</text><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="568" y="103" fill="#A8B3C1" font-size="16.5">access this file?</text><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" x="568" y="128" font-size="14"><tspan fill="#3FB950">$</tspan><tspan fill="#39D0D8"> perm --why bob read FILE</tspan></text>
</svg>
