<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Features: analysis and explanation, comparison, drift detection with baselines, and effective access analysis with --why"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#111B2E"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/></linearGradient></defs>
<rect x="2.5" y="2.5" width="387" height="189" rx="18" fill="url(#bg)" stroke="url(#edge)"/><rect x="2.5" y="2.5" width="387" height="189" rx="18" fill="url(#glass)"/><circle cx="30" cy="34" r="5" fill="#58A6FF"/><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="46" y="40" fill="#FFFFFF" font-size="20" font-weight="700">Analysis &amp; Explanation</text><line x1="24" y1="58" x2="368" y2="58" stroke="#FFFFFF" stroke-opacity="0.08"/><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" x="26" y="86" fill="#58A6FF" font-size="15">›</text><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="44" y="86" fill="#A8B3C1" font-size="15.5">Mode, owner, group, SUID / SGID / sticky</text><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" x="26" y="111" fill="#58A6FF" font-size="15">›</text><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="44" y="111" fill="#A8B3C1" font-size="15.5">--security and --report for structured reports</text><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" x="26" y="136" fill="#58A6FF" font-size="15">›</text><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="44" y="136" fill="#A8B3C1" font-size="15.5">--explain 6755 turns an octal into plain language</text><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" x="26" y="161" fill="#58A6FF" font-size="15">›</text><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="44" y="161" fill="#A8B3C1" font-size="15.5">--json output for scripting</text><rect x="410.5" y="2.5" width="387" height="189" rx="18" fill="url(#bg)" stroke="url(#edge)"/><rect x="410.5" y="2.5" width="387" height="189" rx="18" fill="url(#glass)"/><circle cx="438" cy="34" r="5" fill="#3FB950"/><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="454" y="40" fill="#FFFFFF" font-size="20" font-weight="700">Comparison</text><line x1="432" y1="58" x2="776" y2="58" stroke="#FFFFFF" stroke-opacity="0.08"/><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" x="434" y="86" fill="#3FB950" font-size="15">›</text><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="452" y="86" fill="#A8B3C1" font-size="15.5">Compare two files side by side</text><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" x="434" y="111" fill="#3FB950" font-size="15">›</text><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="452" y="111" fill="#A8B3C1" font-size="15.5">Permissions, ownership and special bits</text><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" x="434" y="136" fill="#3FB950" font-size="15">›</text><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="452" y="136" fill="#A8B3C1" font-size="15.5">--diff shows only the real differences</text><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" x="434" y="161" fill="#3FB950" font-size="15">›</text><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="452" y="161" fill="#A8B3C1" font-size="15.5">--permissions / --ownership / --special filters</text><rect x="2.5" y="212.5" width="387" height="189" rx="18" fill="url(#bg)" stroke="url(#edge)"/><rect x="2.5" y="212.5" width="387" height="189" rx="18" fill="url(#glass)"/><circle cx="30" cy="244" r="5" fill="#8957E5"/><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="46" y="250" fill="#FFFFFF" font-size="20" font-weight="700">Drift Detection</text><line x1="24" y1="268" x2="368" y2="268" stroke="#FFFFFF" stroke-opacity="0.08"/><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" x="26" y="296" fill="#8957E5" font-size="15">›</text><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="44" y="296" fill="#A8B3C1" font-size="15.5">--baseline saves, --check compares later</text><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" x="26" y="321" fill="#8957E5" font-size="15">›</text><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="44" y="321" fill="#A8B3C1" font-size="15.5">--strict adds a SHA-256 content hash</text><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" x="26" y="346" fill="#8957E5" font-size="15">›</text><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="44" y="346" fill="#A8B3C1" font-size="15.5">--scan [--recursive] covers a directory</text><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" x="26" y="371" fill="#8957E5" font-size="15">›</text><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="44" y="371" fill="#A8B3C1" font-size="15.5">[OK] [CHANGED] [NEW] [DELETED] [INVALID]</text><rect x="410.5" y="212.5" width="387" height="189" rx="18" fill="url(#bg)" stroke="url(#edge)"/><rect x="410.5" y="212.5" width="387" height="189" rx="18" fill="url(#glass)"/><circle cx="438" cy="244" r="5" fill="#39D0D8"/><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="454" y="250" fill="#FFFFFF" font-size="20" font-weight="700">Effective Access (--why)</text><line x1="432" y1="268" x2="776" y2="268" stroke="#FFFFFF" stroke-opacity="0.08"/><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" x="434" y="296" fill="#39D0D8" font-size="15">›</text><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="452" y="296" fill="#A8B3C1" font-size="15.5">Step-by-step read / write / exec / delete</text><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" x="434" y="321" fill="#39D0D8" font-size="15">›</text><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="452" y="321" fill="#A8B3C1" font-size="15.5">x needed on every directory in the path</text><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" x="434" y="346" fill="#39D0D8" font-size="15">›</text><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="452" y="346" fill="#A8B3C1" font-size="15.5">First match wins: owner, group, others</text><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" x="434" y="371" fill="#39D0D8" font-size="15">›</text><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="452" y="371" fill="#A8B3C1" font-size="15.5">Sticky bit, symlinks, ro / noexec mounts</text>
</svg>
