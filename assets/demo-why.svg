<svg width="800" height="342" viewBox="0 0 800 342" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal: perm --why nobody delete shows a path walk and a DENIED result because the parent directory lacks write permission"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#111B2E"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/></linearGradient><style>.ln{animation:appear .35s both}@keyframes appear{from{opacity:0}to{opacity:1}}.cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}</style></defs>
<rect x="0.5" y="0.5" width="799" height="341" rx="18" fill="url(#bg)" stroke="url(#edge)"/><rect x="0.5" y="0.5" width="799" height="341" rx="18" fill="url(#glass)"/><circle cx="26" cy="24" r="5.5" fill="#FF5F57"/><circle cx="45" cy="24" r="5.5" fill="#FEBC2E"/><circle cx="64" cy="24" r="5.5" fill="#28C840"/><text font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" x="400.0" y="29" text-anchor="middle" fill="#8B949E" font-size="13">perm --why nobody delete /tmp/pt/f1</text><line x1="1" y1="46" x2="799" y2="46" stroke="#FFFFFF" stroke-opacity="0.08"/><g class="ln" style="animation-delay:0.20s"><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" xml:space="preserve" x="24" y="76" font-size="13.5"><tspan fill="#3FB950">user@linux</tspan><tspan fill="#8B949E">:</tspan><tspan fill="#58A6FF">~</tspan><tspan fill="#8B949E">$</tspan><tspan fill="#E6EDF3"> perm --why nobody delete /tmp/pt/f1</tspan></text></g><g class="ln" style="animation-delay:0.32s"><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" xml:space="preserve" x="24" y="108" font-size="13.5"><tspan fill="#8957E5">Path Walk </tspan><tspan fill="#8B949E">(search permission x is needed on every directory)</tspan></text></g><g class="ln" style="animation-delay:0.44s"><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" xml:space="preserve" x="24" y="130" font-size="13.5"><tspan fill="#3FB950">  [OK]      </tspan><tspan fill="#E6EDF3">dir    /</tspan></text></g><g class="ln" style="animation-delay:0.56s"><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" xml:space="preserve" x="24" y="152" font-size="13.5"><tspan fill="#8B949E">            drwxr-xr-x  root:root  -&gt;  others class: r-x   needs: x</tspan></text></g><g class="ln" style="animation-delay:0.68s"><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" xml:space="preserve" x="24" y="174" font-size="13.5"><tspan fill="#3FB950">  [OK]      </tspan><tspan fill="#E6EDF3">dir    /tmp</tspan></text></g><g class="ln" style="animation-delay:0.80s"><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" xml:space="preserve" x="24" y="196" font-size="13.5"><tspan fill="#8B949E">            drwxrwxrwt  root:root  -&gt;  others class: rwx   needs: x</tspan></text></g><g class="ln" style="animation-delay:0.92s"><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" xml:space="preserve" x="24" y="218" font-size="13.5"><tspan fill="#F85149">  [DENIED]  </tspan><tspan fill="#E6EDF3">parent /tmp/pt</tspan></text></g><g class="ln" style="animation-delay:1.04s"><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" xml:space="preserve" x="24" y="240" font-size="13.5"><tspan fill="#8B949E">            drwxr-xr-x  root:root  -&gt;  others class: r-x   needs: w+x</tspan></text></g><g class="ln" style="animation-delay:1.16s"><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" xml:space="preserve" x="24" y="272" font-size="13.5"><tspan fill="#F85149">Result: DENIED</tspan></text></g><g class="ln" style="animation-delay:1.28s"><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" xml:space="preserve" x="24" y="294" font-size="13.5"><tspan fill="#A8B3C1">  no write+search (w+x) permission on directory /tmp/pt:</tspan></text></g><g class="ln" style="animation-delay:1.40s"><text font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" xml:space="preserve" x="24" y="316" font-size="13.5"><tspan fill="#A8B3C1">  others class has &quot;r-x&quot;, but w+x is required</tspan></text></g>
</svg>
